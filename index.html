<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icons.svg" />
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem("preferences") || "{}")["s:appearance"];
        var prefs = (stored && stored.data) || {};
        var theme = prefs.theme;
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        if (prefs.accent && /^[a-z]+$/.test(prefs.accent) && prefs.accent !== "default") {
          document.documentElement.dataset.accent = prefs.accent;
        }
      } catch (e) {}
    </script>
    <title>Nocosheet</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
