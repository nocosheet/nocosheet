<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icons.svg" />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("preferences") || "{}");
        var root = document.documentElement;
        if (p.theme === "dark" || (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          root.classList.add("dark");
        }
        if (typeof p.accent === "string" && /^[a-z]+$/.test(p.accent) && p.accent !== "default") {
          root.dataset.accent = p.accent;
        }
        if (p.font === "mono") root.dataset.font = "mono";
        if (p.radius === "none") root.dataset.radius = "none";
      } catch (e) {}
    </script>
    <title>Nocosheet</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
